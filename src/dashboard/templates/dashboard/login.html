{% extends "base.html" %}
{% block title %}Log in - AutoML Platform Suite{% endblock %}
{% block content %}
  <h1>Log in</h1>
  {% if form.errors %}
    <p class="errorlist">Incorrect username or password.</p>
  {% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
{% endblock %}
